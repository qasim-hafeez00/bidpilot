name: Smoke eval
on: [pull_request, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    env: { LLM_DISABLED: "1", PYTHONWARNINGS: ignore }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Start GigSim
        run: GIGSIM_INITIAL_RELEASE=all GIGSIM_ERROR_RATE=0 nohup uvicorn gigsim.app:app --port 18081 &
      - name: 30-job smoke eval with failure thresholds (bid F1, unsupported claims)
        run: python -m evals.runners.smoke
      - uses: actions/upload-artifact@v4
        with: { name: smoke-results, path: evals/results/smoke.json }
