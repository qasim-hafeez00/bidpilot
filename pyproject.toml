[project]
name = "bidpilot"
version = "1.0.0"
description = "BidPilot: GigBid, a multi-agent freelancer copilot (LangGraph + MCP + advanced RAG)"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "pyyaml==6.0.2",
  "httpx==0.28.1",
  "python-dotenv==1.1.0",
  "sse-starlette==2.3.3",
  "langgraph==0.4.3",
  "langgraph-checkpoint-postgres==2.0.21",
  "langgraph-supervisor==0.0.21",
  "langchain-core==0.3.59",
  "langchain-ollama==0.3.2",
  "langchain-groq==0.3.2",
  "langchain-openai==0.3.16",
  "langchain-mcp-adapters==0.0.11",
  "mcp==1.8.0",
  "psycopg[binary,pool]==3.2.9",
  "redis==5.2.1",
  "arq==0.26.3",
  "fastembed==0.6.1",
  "qdrant-client==1.14.2",
  "bm25s==0.2.12",
  "numpy==1.26.4",
  "pypdf==5.4.0",
  "cryptography==44.0.3",
  "bcrypt==4.3.0",
  "pyjwt==2.10.1",
  "langsmith==0.3.42",
  "arize-phoenix-otel==0.9.2",
  "openinference-instrumentation-langchain==0.1.42",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.9",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  "reportlab==4.4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "rag*", "mcp_servers*", "worker*", "gigsim*", "evals*", "common*", "scripts*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps/web", "data", "report"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
markers = ["integration: needs GigSim + Postgres running", "llm: needs an LLM backend"]
